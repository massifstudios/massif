version: '3'

vars:
  ENGINE: /mnt/storage/UnrealEngine/5.8.1
  PROJECT: '{{.TASKFILE_DIR}}/Massif.uproject'

tasks:
  build:
    desc: Compile Development Editor binaries
    cmds:
      - '{{.ENGINE}}/Engine/Build/BatchFiles/Linux/Build.sh MassifEditor Linux Development -project={{.PROJECT}} -NoHotReloadFromIDE'

  test:
    desc: Build, then run the Massif automation suite headless
    deps: [build]
    vars:
      REPORT: '{{.TASKFILE_DIR}}/Saved/AutomationReport'
    cmds:
      - rm -rf {{.REPORT}}
      # The editor exits non-zero on a clean run and terminates while the log is
      # still flushing, so the last test or two are routinely missing from it.
      # The exported report is written after the queue drains, and is what the
      # pass/fail decision is actually made on.
      - cmd: UnrealEditor-Cmd {{.PROJECT}} -ExecCmds="Automation RunTests Massif" -TestExit="Automation Test Queue Empty" -ReportExportPath={{.REPORT}} -nullrhi -unattended -nosplash -log
        ignore_error: true
      - python3 {{.TASKFILE_DIR}}/Tools/check_automation_report.py {{.REPORT}}/index.json

  run:
    desc: 'Build, then run the game windowed. Optional: task run SEED=42 DEM=diffusion -- -massif.Water.MinStrahlerOrder=3'
    deps: [build]
    cmds:
      - UnrealEditor {{.PROJECT}} -game -windowed -resx=1920 -resy=1080 {{if .SEED}}-MassifSeed={{.SEED}}{{end}} {{if .DEM}}-MassifDem={{.DEM}}{{end}} {{.CLI_ARGS}}

  editor:
    desc: Open the project in the Unreal editor
    cmds:
      - UnrealEditor {{.PROJECT}}

  screenshot:
    desc: 'Offscreen debug screenshot to Saved/Screenshots. Optional: task screenshot SEED=42 DEM=diffusion'
    deps: [build]
    cmds:
      - UnrealEditor {{.PROJECT}} -game -RenderOffscreen -resx=1600 -resy=900 -MassifScreenshotAfter=30 {{if .SEED}}-MassifSeed={{.SEED}}{{end}} {{if .DEM}}-MassifDem={{.DEM}}{{end}}

  dem:
    desc: 'Fetch the Tirol elevation model into Data/Terrain. Optional: task dem -- --lat 47.13 --lon 10.26 --name arlberg'
    cmds:
      - python3 {{.TASKFILE_DIR}}/Tools/fetch_tirol_dem.py {{.CLI_ARGS}}

  content:
    desc: Regenerate base content assets (L_Massif map, M_Terrain material)
    cmds:
      - UnrealEditor-Cmd {{.PROJECT}} -run=pythonscript -script={{.TASKFILE_DIR}}/Tools/create_base_content.py -unattended -nosplash -nullrhi

  diffusion-dem:
    desc: 'Generate a terrain model with InfiniteDiffusion into Data/Terrain. Optional: task diffusion-dem -- --seed 42'
    vars:
      # The pipeline resolves its global climate rasters relative to the working
      # directory, so it is run from its own checkout rather than from here.
      TERRAIN_DIFFUSION: '{{.TERRAIN_DIFFUSION | default "~/.local/share/massif/terrain-diffusion"}}'
    dir: '{{.TERRAIN_DIFFUSION}}'
    cmds:
      - '{{.TERRAIN_DIFFUSION}}/.venv/bin/python {{.TASKFILE_DIR}}/Tools/generate_diffusion_dem.py --output-directory {{.TASKFILE_DIR}}/Data/Terrain {{.CLI_ARGS}}'

  placeholders:
    desc: Regenerate the stand-in flora meshes drawn until the real models exist
    cmds:
      - UnrealEditor-Cmd {{.PROJECT}} -run=pythonscript -script={{.TASKFILE_DIR}}/Tools/create_placeholder_flora.py -unattended -nosplash -nullrhi

  foliage:
    desc: Import downloaded Poly Haven vegetation models as Nanite static meshes
    cmds:
      - UnrealEditor-Cmd {{.PROJECT}} -run=pythonscript -script={{.TASKFILE_DIR}}/Tools/create_foliage_content.py -unattended -nosplash -nullrhi

  flora:
    desc: Build the grown flora trees under Content/Models/Flora into LOD static meshes
    cmds:
      - UnrealEditor-Cmd {{.PROJECT}} -run=pythonscript -script={{.TASKFILE_DIR}}/Tools/create_flora_content.py -unattended -nosplash -nullrhi
